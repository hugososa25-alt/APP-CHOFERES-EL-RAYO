name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: |
          unzip -o APP_CHOFERES_ANDROID_FUENTE.zip -d android-src

      - name: Buscar proyecto Gradle
        id: locate
        run: |
          if [ -f android-src/settings.gradle ]; then
            echo "dir=android-src" >> "$GITHUB_OUTPUT"
          else
            DIR=$(find android-src -name settings.gradle -printf '%h\n' | head -1)
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
  run: |
    yes | sdkmanager --licenses || true
    sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug

      - name: Preparar APK
        run: |
          APK=$(find "${{ steps.locate.outputs.dir }}" -path '*/build/outputs/apk/debug/*.apk' | head -1)
          cp "$APK" APP-Choferes.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APP-Choferes
          path: APP-Choferes.apk
